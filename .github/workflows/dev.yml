name: Dev Pipeline

on:
  push:
    branches: [dev]

jobs:
  quality-checks:
    name: Quality Checks & Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format Check
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          bash scripts/format.sh --check

      - name: Cppcheck
        shell: bash
        run: |
          apt-get update && apt-get install -y cppcheck
          . $IDF_PATH/export.sh
          bash scripts/cppcheck.sh

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          bash scripts/build.sh
